<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Video Editor — Portfolio</title>
  <meta name="description"
    content="AI-powered video editing portfolio. Stunning visuals, fast turnaround. See my work and get in touch." />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet" />
  <link rel="preload" as="image" href="assets/hero/hero-poster.jpg" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- HERO -->
  <section id="hero" class="hero">
    <div class="hero__stage">
      <video class="hero__video" muted playsinline preload="auto" poster="assets/hero/hero-poster.jpg">
        <source src="assets/hero/hero-loop.mp4" type="video/mp4" />
        <source src="assets/hero/hero-loop.webm" type="video/webm" />
        <img src="assets/hero/hero-poster.jpg" alt="" />
      </video>

      <div class="hero__overlay"></div>
      <div class="hero__content">
        <h1 class="hero__title">Bring Your Stories to Life with AI</h1>
        <div class="scroll-indicator" aria-hidden="true">
          <div class="scroll-indicator__dot"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- PROJECTS -->
  <section id="projects" class="projects">
    <!-- PROJECT 1 -->
    <article class="project-card" id="project-1">
      <div class="project-card__video-wrap project-card__video-wrap--wide">
        <iframe src="https://play.gumlet.io/embed/69eca0f64779ed7c8b61bc47" title="Gumlet video player"
          loading="lazy" referrerpolicy="origin"
          allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen;clipboard-write"
          allowfullscreen></iframe>
      </div>
      <div class="project-card__info">
        <h3 class="project-card__title">AI Neuro Buds</h3>
      </div>
    </article>

    <!-- PROJECT 2 -->
    <article class="project-card" id="project-2">
      <div class="project-card__video-wrap project-card__video-wrap--standard">
        <iframe src="https://play.gumlet.io/embed/69edc7524779ed7c8b7511db" title="Gumlet video player"
          loading="lazy" referrerpolicy="origin"
          allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen;clipboard-write"
          allowfullscreen></iframe>
      </div>
      <div class="project-card__info">
        <h3 class="project-card__title">AI Editing Effects</h3>
      </div>
    </article>

    <!-- PROJECT 3 -->
    <article class="project-card" id="project-3">
      <div class="project-card__video-wrap">
        <iframe src="https://play.gumlet.io/embed/69ec9c4651e0355695cf8c86" title="Gumlet video player"
          loading="lazy" referrerpolicy="origin"
          allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen;clipboard-write"
          allowfullscreen></iframe>
      </div>
      <div class="project-card__info">
        <h3 class="project-card__title">AI Agents Day in Lisbon</h3>
      </div>
    </article>
  </section>

  <!-- CTA -->
  <section id="cta" class="cta">
    <a id="cta-button" class="cta__button" href="mailto:contact@anite.me?subject=Video%20Project%20Inquiry">Let's
      talk</a>
  </section>

  <footer class="footer">
    <p>&copy; 2026 — AI Video Editor</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
